services:
  api-dev:
    build:
      context: ./apps/api
      target: dev
    profiles: [dev]
    ports:
      - "${SERVER_ADDRESS:-8080}:8080"
    volumes:
      - ./apps/api:/app
      - go-modules:/go/pkg/mod
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-dev:
    build:
      context: ./apps/web
      target: dev
    profiles: [dev]
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - node-modules:/app/node_modules
    env_file:
      - ./apps/web/.env
    depends_on:
      - api-dev

  api-prod:
    build:
      context: ./apps/api
      target: prod
    profiles: [prod]
    ports:
      - "${SERVER_ADDRESS:-8080}:8080"
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-prod:
    build:
      context: ./apps/web
      target: prod
    profiles: [prod]
    ports:
      - "3000:3000"
    env_file:
      - ./apps/web/.env
    depends_on:
      - api-prod

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arsen
      POSTGRES_PASSWORD: arsen
      POSTGRES_DB: arsen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arsen -d arsen"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  go-modules:
  node-modules:
