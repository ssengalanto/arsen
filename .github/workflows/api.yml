name: API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: apps/api

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arsen
          POSTGRES_PASSWORD: arsen
          POSTGRES_DB: arsen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arsen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum

      - name: Run tests
        run: go test -race -count=1 ./...
        env:
          DATABASE_URL: postgres://arsen:arsen@localhost:5432/arsen?sslmode=disable

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum

      - name: Build binary
        run: go build -o bin/arsen ./cmd/api
