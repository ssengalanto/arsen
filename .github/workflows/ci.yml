name: CI

on:
  push:
    branches: [main]
    paths:
      - "go.work"
      - "go.work.sum"
      - "Taskfile.yml"
      - "docker-compose*.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "go.work"
      - "go.work.sum"
      - "Taskfile.yml"
      - "docker-compose*.yml"
      - ".github/workflows/ci.yml"

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: apps/api/go.sum

      - name: Build
        run: go build -o bin/arsen ./cmd/api

      - name: Test
        run: go test ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
