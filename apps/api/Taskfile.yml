version: "3"

vars:
  BINARY_NAME: arsen
  MAIN_PATH: ./cmd/api
  MIGRATIONS_DIR: ./migrations
  DATABASE_URL: '{{.DATABASE_URL | default "postgres://arsen:arsen@localhost:5432/arsen?sslmode=disable"}}'

tasks:
  build:
    desc: Build the application binary
    cmds:
      - go build -o bin/{{.BINARY_NAME}} {{.MAIN_PATH}}

  run:
    desc: Run the application locally
    cmds:
      - go run {{.MAIN_PATH}}

  test:
    desc: Run all tests
    cmds:
      - go test ./... {{.CLI_ARGS}}

  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lint-fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix ./...

  swagger:
    desc: Generate Swagger documentation
    cmds:
      - swag init -g {{.MAIN_PATH}}/main.go -o docs/swagger

  migrate-up:
    desc: Apply all pending migrations
    cmds:
      - migrate -path {{.MIGRATIONS_DIR}} -database "{{.DATABASE_URL}}" up

  migrate-down:
    desc: Rollback the last migration
    cmds:
      - migrate -path {{.MIGRATIONS_DIR}} -database "{{.DATABASE_URL}}" down 1

  migrate-create:
    desc: Create a new migration file pair
    cmds:
      - migrate create -ext sql -dir {{.MIGRATIONS_DIR}} -seq {{.CLI_ARGS}}

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy
