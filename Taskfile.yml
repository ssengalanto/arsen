version: "3"

includes:
  api:
    taskfile: ./apps/api/Taskfile.yml
    dir: ./apps/api
  web:
    taskfile: ./apps/web/Taskfile.yml
    dir: ./apps/web

tasks:
  test:
    desc: Run all tests across both workspaces
    cmds:
      - task: api:test
      - task: web:test

  lint:
    desc: Run all linters across both workspaces
    cmds:
      - task: api:lint
      - task: web:lint

  build:
    desc: Build both workspaces
    cmds:
      - task: api:build
      - task: web:build

  dev:
    desc: Start full dev stack via Docker Compose
    cmds:
      - docker compose --profile dev up --build

  docker-up:
    desc: Start production stack
    cmds:
      - docker compose --profile prod up --build -d

  docker-down:
    desc: Stop all containers and remove volumes
    cmds:
      - docker compose down -v
